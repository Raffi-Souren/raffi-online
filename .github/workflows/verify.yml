name: verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit and contract tests
        run: pnpm test

      - name: Run lint
        run: pnpm run lint

      - name: Build production site
        run: pnpm run build

      - name: Run production browser and performance gates
        shell: bash
        run: |
          pnpm start --hostname 127.0.0.1 --port 3100 > /tmp/raffi-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/world/index.html > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/raffi-next.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3100/world/index.html > /dev/null
          export RAFFI_WORLD_URL=http://127.0.0.1:3100/world/index.html
          export RAFFI_SMOKE_OUT=/tmp/raffi-world-smoke
          pnpm run test:world:browser
          export RAFFI_SMOKE_OUT=/tmp/raffi-camera-budget
          pnpm run test:world:budget

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate-evidence
          path: |
            /tmp/raffi-next.log
            /tmp/raffi-world-smoke
            /tmp/raffi-camera-budget
          if-no-files-found: ignore
